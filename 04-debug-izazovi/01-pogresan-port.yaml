apiVersion: apps/v1
kind: Deployment
metadata:
  name: greska-port
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-port
  template:
    metadata:
      labels:
        app: web-port
    spec:
      containers:
      - name: flask-app
        image: harbor.lenitech.local/obuka/lenitech-app:v1 # Radi na 5000
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: servis-port
spec:
  type: NodePort
  selector:
    app: web-port
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080 
      nodePort: 30001