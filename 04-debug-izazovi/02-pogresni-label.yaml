apiVersion: apps/v1
kind: Deployment
metadata:
  name: greska-label
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prodavnica-backend # OVO JE ISPRAVNO
  template:
    metadata:
      labels:
        app: prodavnica-backend
    spec:
      containers:
      - name: web-app
        image: harbor.lenitech.local/obuka/lenitech-app:v1
---
apiVersion: v1
kind: Service
metadata:
  name: servis-label
spec:
  type: ClusterIP
  selector:
    app: prodavnica-backen # GRESKA: Fali 'd', servis ne može da nađe podove!
  ports:
    - port: 80
      targetPort: 5000